<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

:root {
  --primary: #4fc3f7;
  --primary-dark: #039be5;
  --accent: #ff6b6b;
  --bg: #f5f7fb;
  --text: #1f2937;
  --muted: #6b7280;
  --card-bg: #fff;
  --shadow: rgba(0,0,0,0.08);
  --header-height: 70px;
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
body { background: var(--bg); color: var(--text); display:flex; flex-direction:column; min-height:100vh; }

header {
  position: sticky;
  top:0;
  width:100%;
  height: var(--header-height);
  background:#fff;
  display:flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 2rem;
  box-shadow: 0 2px 8px var(--shadow);
  z-index:100;
}

.profile {
  display:flex;
  align-items:center;
  gap:12px;
}
.profile img {
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
}

nav a {
  margin-left:2rem;
  text-decoration:none;
  color: var(--text);
  font-weight:600;
}
nav a:hover { color: var(--primary); }

.intro {
  max-width:1200px;
  margin:2rem auto;
  padding:0 2rem;
}
.intro h2 {
  font-size:2rem;
  font-weight:700;
  margin-bottom:0.5rem;
}
.intro p {
  color: var(--muted);
  font-size:1.05rem;
}

main {
  min-width: 1200px;
  padding:2rem;
  margin:auto;
}

/* ===== Resume Card ===== */

.resume-card {
  background: var(--card-bg);
  border-radius:16px;
  padding:2rem;
  box-shadow: 0 10px 20px var(--shadow);
  transition:0.3s ease;
}

.resume-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 30px var(--shadow);
}

/* ===== Language Switch ===== */

.language-switch {
  display:flex;
  gap:1rem;
  margin-bottom:1.5rem;
}

.lang-btn {
  padding:0.5rem 1.2rem;
  border-radius:10px;
  border:none;
  font-weight:600;
  cursor:pointer;
  background:#eef8ff;
  color:var(--primary-dark);
  transition:0.25s;
}

.lang-btn.active,
.lang-btn:hover {
  background: var(--primary);
  color:white;
}

/* ===== PDF Viewer ===== */

iframe {
  width:100%;
  height:600px;
  border:none;
  border-radius:12px;
  margin-bottom:1.5rem;
}

/* ===== Download Button ===== */

.download-btn {
  display:inline-flex;
  align-items:center;
  gap:0.5rem;
  padding:0.7rem 1.4rem;
  background: var(--primary);
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:600;
  transition:0.25s;
}

.download-btn:hover {
  background: var(--primary-dark);
  transform:translateY(-2px);
}

footer {
  margin-top:auto;
  text-align:center;
  padding:1.5rem 2rem;
  color:var(--muted);
  font-size:0.9rem;
  border-top:1px solid #e0e0e0;
  background:#fff;
}

@media(max-width:600px){
  header {
    flex-direction: column;
    height: auto;
    padding: 1rem;
    align-items: flex-start;
  }
  .profile {
    width: 100%;
    margin-bottom: 1rem;
  }
  nav {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  nav a {
    margin-left: 0;
    margin-right: 1.5rem;
  }
}

@media(max-width:600px){

  main {
    min-width: auto;   /* remove forced width */
    width: 100%;
    padding: 1rem;
  }

}
</style>
</head>

<body>

<header>
  <div class="profile">
    <img src="images/profile.jpg">
    <h2>Mohamed Said</h2>
  </div>
  <nav>
    <a href="index.html">Portfolio</a>
    <a href="projects.html">Projects</a>
    <a href="resume.html">Resume</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="intro">
  <h2>Resume</h2>
  <p>View or download my CV in your preferred language.</p>
</section>

<main>

  <div class="resume-card">

    <div class="language-switch">
      <button id="btn-en" class="lang-btn active" onclick="loadCV('en')">English</button>
      <button id="btn-fr" class="lang-btn" onclick="loadCV('fr')">Français</button>
    </div>

    <iframe id="cvViewer" src="cv/Mohamed_Said_Benyaishe_Resume_English.pdf"></iframe>

    <a id="downloadBtn"
       class="download-btn"
       href="cv/Mohamed_Said_Benyaishe_Resume_English.pdf"
       download>
       Download CV
    </a>

  </div>

</main>

<footer>
  &copy; 2026 Mohamed Said Benyaich • DEVOWFS203
</footer>

<script>
function loadCV(lang) {

  const viewer = document.getElementById("cvViewer");
  const downloadBtn = document.getElementById("downloadBtn");

  document.getElementById("btn-en").classList.remove("active");
  document.getElementById("btn-fr").classList.remove("active");

  if (lang === "fr") {
    viewer.src = "cv/Mohamed_Said_Benyaiche_Resume_French.pdf";
    downloadBtn.href = "cv/Mohamed_Said_Benyaiche_Resume_French.pdf";
    document.getElementById("btn-fr").classList.add("active");
  } else {
    viewer.src = "cv/Mohamed_Said_Benyaishe_Resume_English.pdf";
    downloadBtn.href = "cv/Mohamed_Said_Benyaishe_Resume_English.pdf";
    document.getElementById("btn-en").classList.add("active");
  }
}
</script>

</body>
</html>
